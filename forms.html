    <h1>Формы</h1>

    <h2>Форма контактов</h2>
    <form
      action="https://postman-echo.com/post"
      method="POST"
      name="ContactForm"
      id="ContactForm"
      target="_blank"
    >
      <label>Фамилия:</label>
      <input type="text" name="lastname" value="Глинин" /><br />

      <label>Имя:</label>
      <input type="text" name="firstname" value="Бесик" /><br />

      <label>Группа:</label>
      <input type="text" name="group" value="Вискас 5" /><br />

      <label>Телефон:</label>
      <input type="text" name="phone" value="+7 777 777-77-77" /><br />

      <label>Email:</label>
      <input type="email" name="email" value="besik_glinin@meow.ru" /><br />

      <label>Дата:</label>
      <input type="date" name="date" value="2026-05-09" /><br />

      <p>Комментарий:</p>
      <textarea name="comment" cols="40" rows="3">Бесик самый лучший котенок в мире</textarea>

      <br /><br />
      <input type="reset" value="Очистить" />
      <input type="submit" value="Отправить" />
    </form>

    <p><a href="#top">К началу страницы</a></p>

    <h2>Форма заказа корма</h2>
    <form
      action="https://postman-echo.com/post"
      method="POST"
      name="OrderForm"
      id="OrderForm"
      target="_blank"
    >
      <label>Товар:</label>
      <input type="text" name="product" value="Корм для Бесика" /><br />

      <label>Количество:</label>
      <input type="number" name="quantity" value="5" /><br />

      <p>Тип доставки:</p>
      <label
        ><input type="radio" name="delivery" value="обычная" checked />
        Обычная</label
      >
      <label
        ><input type="radio" name="delivery" value="экспресс" /> Экспресс</label
      >

      <p>Дополнительно:</p>
      <label
        ><input type="checkbox" name="options" value="игрушка" /> Игрушка</label
      >
      <label
        ><input type="checkbox" name="options" value="расчёска" />
        Расчёска</label
      >

      <p>Способ оплаты:</p>
      <select name="payment">
        <option value="карта">Картой</option>
        <option value="наличные">Наличными</option>
        <option value="онлайн">Онлайн</option>
      </select>

      <br /><br />
      <label>Дата доставки:</label>
      <input type="date" name="delivery_date" value="2026-05-10" /><br />

      <label>Пароль:</label>
      <input type="password" name="password" value="bes_s_nebes" /><br />

      <input type="hidden" name="shop_id" value="BESYATINA" />

      <br />
      <input type="reset" value="Очистить" />
      <input type="submit" value="Заказать" />
    </form>

    <p><a href="#top">К началу страницы</a></p>

    <hr />
    <p><a href="index.html">На главную</a></p>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Формы</title>
    <style>
      body {
        font-family: Arial;
        background: #ffffff;
        margin: 20px;
        color: #1a1a1a;
      }
      img {
        max-width: 100%;
        height: auto;
      }
      nav {
        background: #1a1a1a;
        padding: 10px;
      }
      nav a {
        color: #ffffff;
        margin-right: 15px;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 5px;
      }
      nav a:hover {
        background: #4a4a4a;
      }
      .active {
        background: #808080;
        color: #ffffff;
        padding: 5px;
      }
      h1 {
        color: #1a1a1a;
        border-bottom: 3px solid #4a4a4a;
        padding-bottom: 10px;
      }
      h2 {
        color: #4a4a4a;
      }
      input,
      textarea,
      select {
        display: block;
        margin: 5px 0;
        padding: 8px;
        border: 1px solid #4a4a4a;
        border-radius: 5px;
        width: 300px;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: #808080;
        outline: none;
        background: #f5f5f5;
      }
      input[type="radio"],
      input[type="checkbox"] {
        display: inline;
        width: auto;
      }
      input[type="submit"],
      input[type="reset"] {
        background: #4a4a4a;
        color: #ffffff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        width: auto;
        display: inline-block;
        margin-right: 10px;
      }
      input[type="submit"]:hover,
      input[type="reset"]:hover {
        background: #1a1a1a;
      }
      a {
        color: #4a4a4a;
      }
    </style>
  </head>
  <body>
    <a id="top"></a>

    <nav>
      <a href="index.html" target="_self">Главная</a>
      <a href="forms.html" class="active" target="_self">Формы</a>
      <a href="js.html" target="_self">JavaScript</a>
      <a href="index.html#photos" target="_self">Фото кота</a>
      <a
        href="https://github.com/vmarshirov/g06u28/tree/main/010_html/060_anchor"
        target="_blank"
        >Пример якорей</a
      >
    </nav>

    <h1>Формы</h1>

    <h2>Форма контактов</h2>
    <form
      action="https://postman-echo.com/post"
      method="POST"
      name="ContactForm"
      id="ContactForm"
      target="_blank"
    >
      <label>Фамилия:</label>
      <input type="text" name="lastname" value="Глинин" />

      <label>Имя:</label>
      <input type="text" name="firstname" value="Бесик" />

      <label>Группа:</label>
      <input type="text" name="group" value="Вискас 5" />

      <label>Телефон:</label>
      <input type="text" name="phone" value="+7 777 777-77-77" />

      <label>Email:</label>
      <input type="email" name="email" value="besik_glinin@meow.ru" />

      <label>Дата:</label>
      <input type="date" name="date" value="2026-09-05" />

      <p>Комментарий:</p>
      <textarea name="comment" cols="40" rows="3">
Бесик самый лучший котенок в мире</textarea
      >

      <input type="reset" value="Очистить" />
      <input type="submit" value="Отправить" />
    </form>

    <p><a href="#top" target="_self">К началу страницы</a></p>

    <h2>Форма заказа корма</h2>
    <form
      action="https://postman-echo.com/post"
      method="POST"
      name="OrderForm"
      id="OrderForm"
      target="_blank"
    >
      <label>Товар:</label>
      <input type="text" name="product" value="Корм для Бесика" />

      <label>Количество:</label>
      <input type="number" name="quantity" value="5" />

      <p>Тип доставки:</p>
      <label
        ><input type="radio" name="delivery" value="обычная" checked />
        Обычная</label
      >
      <label
        ><input type="radio" name="delivery" value="экспресс" /> Экспресс</label
      >

      <p>Дополнительно:</p>
      <label
        ><input type="checkbox" name="options" value="игрушка" /> Игрушка</label
      >
      <label
        ><input type="checkbox" name="options" value="расчёска" />
        Расчёска</label
      >

      <p>Способ оплаты:</p>
      <select name="payment">
        <option value="карта">Картой</option>
        <option value="наличные">Наличными</option>
        <option value="онлайн">Онлайн</option>
      </select>

      <label>Дата доставки:</label>
      <input type="date" name="delivery_date" value="2026-05-10" />

      <label>Пароль:</label>
      <input type="password" name="password" value="bes_s_nebes" />

      <input type="hidden" name="shop_id" value="BESYATINA" />

      <input type="reset" value="Очистить" />
      <input type="submit" value="Заказать" />
    </form>

    <p><a href="#top" target="_self">К началу страницы</a></p>

    <hr />
    <p><a href="index.html" target="_self">На главную</a></p>
  </body>
</html>
